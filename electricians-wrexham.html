      <h2>Frequently asked questions</h2>
      <h3>What are the electrical inspection duties for landlords under the Renting Homes (Wales) Act in Wrexham?</h3><p>Landlords in Wrexham must ensure their rental properties pass an EICR test every 5 years. In addition, Welsh legislation requires mains-powered, interconnected smoke and heat alarms on each floor, alongside annual safety checks for all electrical accessories.</p>
      <h3>How does three-phase electrical maintenance work for industrial units on Wrexham Industrial Estate?</h3><p>Industrial facilities require tailored maintenance routines to protect machinery and workforce safety. We provide thermal imaging inspections, sub-distribution board upgrades, motor control wiring, and periodic 3-year commercial EICR testing with minimal operational disturbance.</p>
      <h3>What is involved in a full domestic property rewire in Wrexham?</h3><p>A full rewire replaces all hidden electrical cables, backboxes, socket outlets, switches, and the central consumer unit. Completed in two stages (first fix cabling and second fix accessory fitting), rewires bring older housing stock in Acton, Rhosddu, or Borras up to current BS 7671 standards.</p>
      <h3>Do I need an RCD or RCBO consumer unit for an EV charger installation in Wrexham?</h3><p>Yes. Modern smart EV wallboxes require individual Type A or Type B RCD protection alongside Surge Protection Devices (SPD). Our engineers assess your current fuse box capacity and install dedicated sub-boards if necessary to meet IET Wiring Regulations.</p>
      <h3>What should I do if an EICR report shows C2 defects on my Wrexham property?</h3><p>C2 indicates a potential danger requiring urgent attention. Property owners and landlords must instruct remedial repairs within 28 days. Once remedied, we issue a clear Electrical Installation Certificate confirming the installation is safe and compliant.</p>
