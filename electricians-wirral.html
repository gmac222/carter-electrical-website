      <h2>Frequently asked questions</h2>
      <h3>How do I know if my house on the Wirral needs a complete rewire?</h3><p>Common warning signs in older Wirral properties (especially period homes in Heswall, Caldy, or West Kirby) include original fabric or rubber insulated cables, fuse boxes with rewireable fuse wire, dimming lights, or a lack of earthing on metal switches.</p>
      <h3>What electrical certificate is legally required for rented properties on the Wirral?</h3><p>Landlords across Wirral Council postcodes must possess a valid Electrical Installation Condition Report (EICR) issued by a registered electrician every 5 years. Failure to comply can result in local authority fines of up to £30,000.</p>
      <h3>Is an NICEIC Approved Contractor required for commercial premises in Bromborough?</h3><p>While the law requires a &quot;competent person&quot;, using an NICEIC Approved Contractor guarantees that the business meets rigorous annual technical assessments. We service retail units, offices, and industrial facilities in Bromborough and Birkenhead.</p>
      <h3>What is Part P building regulations compliance for domestic electrical work on the Wirral?</h3><p>Part P requires that electrical installations in dwellings are designed and installed safely. Major additions, bathroom alterations, and fuse box upgrades must be notified to Building Control. We handle all notifications and issue official certificates automatically.</p>
      <h3>How long does a domestic smart EV charger installation take on the Wirral?</h3><p>A standard domestic wallbox installation takes between 3 and 4 hours. Our engineers verify your main fuse board capacity, install dedicated cable routing, configure smart app control, and notify SP Energy Networks.</p>
