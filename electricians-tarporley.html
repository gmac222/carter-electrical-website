      <h3>What is the difference between an EICR and an Electrical Installation Certificate (EIC)?</h3><p>An Electrical Installation Certificate (EIC) is issued for new electrical installations, complete property rewires, or consumer unit replacements. An Electrical Installation Condition Report (EICR) is an in-depth safety inspection of existing fixed wiring, mandatory for landlords every 5 years and recommended for property buyers across CW6.</p>
      <h3>Can I replace sockets or light switches myself under UK Building Regulations?</h3><p>Under Part P of the Building Regulations, minor straightforward replacements of existing accessories are permitted for DIY. However, any work in special locations (such as bathrooms), new circuit additions, or fuse box replacements must be completed and certified by a registered competent electrician like Carter Electrical to guarantee safety and compliance.</p>

      <h3>Do I need DNO permission to install a fast EV charger in Tarporley?</h3><p>Yes. Every grid-connected EV charger requires notification or prior consent from the local Distribution Network Operator (SP Energy Networks across Cheshire). As OZEV-approved installers, we handle all DNO applications and assess your main fuse capacity before installation.</p>
